services:
  # The Q-Flash AI Engine (Direct Access)
  qflash-app:
    build: .
    ports:
      - "3000:3000"  # You can now visit http://localhost:3000 directly
    environment:
      - REDIS_URL=redis://session-store:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
    depends_on:
      - session-store

  # Shared Redis Store
  session-store:
    image: redis:alpine
    ports:
      - "6380:6380"