services:
  sms-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://cache:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
    deploy:
      replicas: 3  # Scale to 3 instances immediately
    depends_on:
      - cache

  cache:
    image: redis:alpine
    ports:
      - "6379:6379"