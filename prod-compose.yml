services:
  # Nginx Gateway (Port 80) + Front-End Load Balancer
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - qflash-app

  # The Scalable Node.js Service
  qflash-app:
    build: .
    deploy:
      replicas: 3 # Start with 3 containers to test load balancing
    environment:
      - REDIS_URL=redis://session-store:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
    depends_on:
      - session-store

  # The Distributed State Manager
  session-store:
    image: redis:alpine
    ports:
      - "6379:6379"